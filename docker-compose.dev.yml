services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: bizpulse-backend:dev
    container_name: bizpulse-backend-dev
    restart: "no"
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000
      - JWT_SECRET_KEY=bizpulse_dev_jwt_secret_key_change_in_production_2026
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=120
      - COOKIE_SECURE=false
      - ALLOW_REGISTRATION=true
      - AUTH_PROVISIONING_KEY=bizpulse_demo_provisioning_key_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-flash
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    networks:
      - bizpulse-dev-net
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    image: node:22-alpine
    container_name: bizpulse-frontend-dev
    working_dir: /app
    restart: "no"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - bizpulse-dev-net
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

networks:
  bizpulse-dev-net:
    driver: bridge
