name: BizPulse CI/CD & Automated Release Validation

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Restrict default permissions to read-only for least-privilege security
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Test & Code Quality
  # ============================================================================
  backend-test:
    name: Backend Pytest Suite (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Automated Pytest Suite
        env:
          ENVIRONMENT: test
          HOST: 127.0.0.1
          PORT: 8000
          ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
          JWT_SECRET_KEY: "ci_test_jwt_secret_key_minimum_32_characters_long_12345"
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
          COOKIE_SECURE: "false"
          ALLOW_REGISTRATION: "true"
          AUTH_PROVISIONING_KEY: "bizpulse_demo_provisioning_key_2026"
          DATA_DIR: "${{ github.workspace }}/backend/data"
          DATABASE_PATH: "${{ github.workspace }}/backend/data/bizpulse.db"
          BACKUP_DIR: "${{ github.workspace }}/backend/data/backups"
          LOG_LEVEL: INFO
        run: |
          cd backend
          pytest tests -v --junitxml=../test-results-backend.xml

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results-backend.xml
          retention-days: 14

  # ============================================================================
  # 2. Frontend Strict TypeScript Check & Vite Production Build
  # ============================================================================
  frontend-build:
    name: Frontend Strict Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies via Lockfile
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Strict Check & Production Bundle
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Static Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist-bundle
          path: frontend/dist
          retention-days: 14

  # ============================================================================
  # 3. Docker Multi-Stage Image Builds
  # ============================================================================
  docker-build:
    name: Docker Image Build & Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (Local Daemon)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: bizpulse-backend:ci
          load: true
          push: false

      - name: Build Frontend Docker Image (Local Daemon)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=
          tags: bizpulse-frontend:ci
          load: true
          push: false

      - name: Verify Built Images Exist in Local Daemon
        run: |
          docker image ls | grep bizpulse

  # ============================================================================
  # 4. Container Integration Testing & Runtime Health Validation
  # ============================================================================
  container-integration-test:
    name: Container Integration & Persistence Test
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Test Environment Configuration
        run: |
          cat << 'EOF' > .env.ci
          ENVIRONMENT=production
          HOST=0.0.0.0
          PORT=8000
          ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80
          JWT_SECRET_KEY=ci_integration_jwt_secret_key_minimum_32_characters_123456
          JWT_ALGORITHM=HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
          COOKIE_SECURE=true
          ALLOW_REGISTRATION=false
          AUTH_PROVISIONING_KEY=ci_integration_provisioning_key_24_chars_min
          LOG_LEVEL=INFO
          TRUST_PROXY_HEADERS=true
          TRUSTED_PROXIES=frontend,127.0.0.1
          FRONTEND_PORT=80
          EOF

      - name: Start Services via Docker Compose
        run: |
          docker compose --env-file .env.ci up -d --build

      - name: Wait for Containers to Reach Healthy State
        run: |
          echo "Waiting for backend health check..."
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' bizpulse-backend || echo '"unknown"')
            echo "Attempt $i: Backend status is $STATUS"
            if [ "$STATUS" = '"healthy"' ]; then
              echo "Backend container reached healthy state!"
              break
            fi
            sleep 2
          done

      - name: Verify Backend Minimal Health Endpoint
        run: |
          HTTP_STATUS=$(docker compose --env-file .env.ci exec -T backend curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health)
          echo "Backend /api/health returned HTTP $HTTP_STATUS"
          [ "$HTTP_STATUS" -eq 200 ] || exit 1

      - name: Verify Frontend Web Server Responds
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/)
          echo "Frontend root returned HTTP $HTTP_STATUS"
          [ "$HTTP_STATUS" -eq 200 ] || exit 1

      - name: Verify Nginx Reverse Proxy to Backend
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/api/health)
          echo "Nginx reverse proxy /api/health returned HTTP $HTTP_STATUS"
          [ "$HTTP_STATUS" -eq 200 ] || exit 1

      - name: Verify Authentication Endpoint Responds
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:80/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"sarah.connor@bizpulse.internal","password":"wrongpassword"}')
          echo "Auth login with wrong credentials returned HTTP $HTTP_STATUS (expected 401)"
          [ "$HTTP_STATUS" -eq 401 ] || exit 1

      - name: Verify Non-Root User Execution
        run: |
          BACKEND_UID=$(docker compose --env-file .env.ci exec -T backend id -u)
          BACKEND_USER=$(docker compose --env-file .env.ci exec -T backend whoami)
          echo "Backend container runs as: $BACKEND_USER (UID: $BACKEND_UID)"
          [ "$BACKEND_UID" -eq 10001 ] || exit 1

      - name: Verify Volume Persistence Across Container Restart
        run: |
          echo "Restarting containers..."
          docker compose --env-file .env.ci restart
          sleep 5
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/api/health)
          echo "Backend returned HTTP $HTTP_STATUS after restart"
          [ "$HTTP_STATUS" -eq 200 ] || exit 1

      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          echo "=== BACKEND CONTAINER LOGS ==="
          docker compose --env-file .env.ci logs backend || true
          echo "=== FRONTEND CONTAINER LOGS ==="
          docker compose --env-file .env.ci logs frontend || true

      - name: Teardown and Clean Up Containers & Volumes
        if: always()
        run: |
          docker compose --env-file .env.ci down -v --remove-orphans
          rm -f .env.ci

  # ============================================================================
  # 5. Container Image Vulnerability Scanning (Trivy)
  # ============================================================================
  security-vulnerability-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Re-build Backend Image for Scanning
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: bizpulse-backend:scan
          load: true
          push: false

      - name: Re-build Frontend Image for Scanning
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: bizpulse-frontend:scan
          load: true
          push: false

      - name: Run Trivy Vulnerability Scanner on Backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "bizpulse-backend:scan"
          format: "table"
          output: "trivy-backend-report.txt"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          exit-code: "0"

      - name: Run Trivy Vulnerability Scanner on Frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "bizpulse-frontend:scan"
          format: "table"
          output: "trivy-frontend-report.txt"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          exit-code: "0"

      - name: Generate Machine-Readable JSON Scan Reports
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "bizpulse-backend:scan"
          format: "json"
          output: "trivy-backend-report.json"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Vulnerability Scan Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-scan-reports
          path: |
            trivy-backend-report.txt
            trivy-frontend-report.txt
            trivy-backend-report.json
          retention-days: 14

  # ============================================================================
  # 6. Final Automated Release Gate
  # ============================================================================
  release-validation-gate:
    name: Release Readiness Gate
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
      - docker-build
      - container-integration-test
      - security-vulnerability-scan
    steps:
      - name: Log Release Validation Status
        run: |
          echo "===================================================================="
          echo "All automated release criteria successfully satisfied!"
          echo "- Backend Pytest Suite: PASSED"
          echo "- Frontend Strict TypeScript & Vite Build: PASSED"
          echo "- Multi-Stage Docker Builds: PASSED"
          echo "- Container Integration & Persistence Testing: PASSED"
          echo "- Trivy Container Vulnerability Scan: COMPLETED"
          echo "===================================================================="
          echo "Status: Artifact is validated and qualified for production deployment."
